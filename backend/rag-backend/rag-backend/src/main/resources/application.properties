spring.application.name=rag-backend

# ==============================
# PostgreSQL
# ==============================

spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.apxtbhxakhwjlbmblyad
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# Ollama
# ==============================

# ==============================
# OpenAI
# ==============================
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Chat model
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=120

# Embedding model
spring.ai.openai.embedding.options.model=text-embedding-3-small

# ==============================
# Server
# ==============================

server.port=8080

# ==============================
# File upload
# ==============================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000